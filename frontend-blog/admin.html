<!-- frontend/admin.html (contoh sederhana admin) -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Admin - Portfolio Blog</title>
  <style>
    body{font-family: system-ui, sans-serif; max-width: 800px; margin: 32px auto}
    input, textarea, select{width:100%; padding:8px; margin:4px 0}
    button{padding:8px 12px}
    .row{display:flex; gap:12px}
    .row>*{flex:1}
    pre{background:#f6f8fa; padding:8px}
  </style>
</head>
<body>
<h1>Admin</h1>

<section>
  <h2>1) Login</h2>
  <div class="row">
    <input id="email" placeholder="email" value="admin@example.com"/>
    <input id="password" type="password" placeholder="password" value="changeme"/>
  </div>
  <button onclick="login()">Login</button>
  <p>Token:</p>
  <pre id="token"></pre>
</section>

<section>
  <h2>2) Buat Kategori</h2>
  <input id="catName" placeholder="Nama kategori"/>
  <button onclick="createCategory()">Create</button>
  <pre id="catOut"></pre>
</section>

<section>
  <h2>3) Buat Post</h2>
  <input id="title" placeholder="Judul"/>
  <textarea id="content" rows="6" placeholder="Konten markdown/HTML bebas"></textarea>
  <div class="row">
    <select id="status">
      <option>draft</option>
      <option>published</option>
    </select>
    <input id="categoryId" placeholder="Category ID (angka)"/>
  </div>
  <button onclick="createPost()">Publish</button>
  <pre id="postOut"></pre>
</section>

<script>
const API = (path) => `${location.origin.replace(/:\d+$/,'')}:8080${path}`;

async function login(){
  const res = await fetch(API('/api/v1/auth/login'), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: email.value, password: password.value})
  });
  const data = await res.json();
  token.textContent = JSON.stringify(data, null, 2);
  localStorage.setItem('token', data.token || '');
}

async function createCategory(){
  const t = localStorage.getItem('token');
  const res = await fetch(API('/api/v1/admin/categories'), {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},
    body: JSON.stringify({name: catName.value})
  });
  catOut.textContent = JSON.stringify(await res.json(), null, 2);
}

async function createPost(){
  const t = localStorage.getItem('token');
  const res = await fetch(API('/api/v1/admin/posts'), {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},
    body: JSON.stringify({
      title: title.value, content: content.value,
      status: status.value, category_id: Number(categoryId.value||0)
    })
  });
  postOut.textContent = JSON.stringify(await res.json(), null, 2);
}
</script>
</body>
</html>
