<!-- frontend/index.html (publik: list & detail sederhana via console) -->
<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Portfolio</title></head>
<body>
<h1>Portfolio Posts</h1>
<ul id="list"></ul>
<script>
const API = (path) => `${location.origin.replace(/:\d+$/,'')}:8080${path}`;
(async () => {
  const res = await fetch(API('/api/v1/public/posts?page=1&page_size=5'));
  const data = await res.json();
  const ul = document.getElementById('list');
  data.items.forEach(p => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.textContent = p.title + ' ('+p.slug+')';
    a.href = '#';
    a.onclick = async () => {
      const d = await (await fetch(API('/api/v1/public/posts/'+p.slug))).json();
      alert(d.title + "\n\n" + d.content);
    };
    li.appendChild(a);
    ul.appendChild(li);
  });
})();
</script>
</body>
</html>
